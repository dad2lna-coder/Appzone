name: Update README app links

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'tools/update-readme-links.mjs'
      - '.github/workflows/update-readme-links.yml'

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update README app links
        run: node tools/update-readme-links.mjs

      - name: Commit README if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README app links already up to date"
            exit 0
          fi
          git commit -m "docs: update app links [skip ci]"
          git push
